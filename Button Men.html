<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Button Men</title>
<style>
  :root { --p1:#3b82f6; --p2:#ef4444; --bg:#111827; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:system-ui,sans-serif; background:var(--bg); color:#f3f4f6; min-height:100vh; padding:16px; }
  h1 { text-align:center; margin-bottom:4px; }
  .sub { text-align:center; color:#9ca3af; margin-bottom:16px; font-size:.9rem; }
  .panel { max-width:900px; margin:0 auto; }
  .board { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:12px; }
  .player { background:#1f2937; border-radius:12px; padding:12px; border:2px solid transparent; }
  .player.active { border-color:#fbbf24; }
  .player h2 { font-size:1rem; margin-bottom:8px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:4px;}
  .player h2 .score { color:#9ca3af; font-weight:400; font-size:.8rem; }
  .dice { display:flex; flex-wrap:wrap; gap:8px; }
  .die { width:56px; height:56px; border-radius:8px; display:flex; align-items:center; justify-content:center;
         font-weight:700; font-size:1.3rem; color:#fff; position:relative; cursor:pointer; user-select:none;
         box-shadow:0 2px 6px rgba(0,0,0,.4); }
  .die .size { position:absolute; bottom:2px; right:4px; font-size:.6rem; opacity:.8; }
  .die.sel { outline:3px solid #fbbf24; outline-offset:2px; }
  .die.target { outline:3px solid #ef4444; outline-offset:2px; animation:pulse 0.7s ease-in-out 2; }
  .die.rerolled { animation:flashNew 1s ease-out 1; }
.die.rerolled.once-done { animation:none; }
  @keyframes flashNew { 0% { box-shadow:0 0 0 4px #22d3ee; filter:brightness(1.6); } 100% { box-shadow:0 2px 6px rgba(0,0,0,.4); filter:none; } }
  @keyframes pulse { 50% { transform:scale(1.12); } }
  .die.dead { opacity:.3; cursor:default; background:#374151 !important; }
  .p1 .die:not(.dead) { background:var(--p1); } .p2 .die:not(.dead) { background:var(--p2); }
  .status { text-align:center; background:#1f2937; border-radius:12px; padding:12px; margin-bottom:12px; min-height:56px; font-size:1rem; }
  .status .big { font-size:1.1rem; font-weight:700; display:block; margin-bottom:6px; }
  .controls { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-bottom:12px; }
  button { background:#374151; color:#f3f4f6; border:none; border-radius:8px; padding:10px 18px; font-size:.95rem; cursor:pointer; }
  button:hover { background:#4b5563; }
  button.primary { background:#fbbf24; color:#111827; font-weight:700; }
  #passBtn.alert { background:#ef4444; color:#fff; font-weight:700; animation:passPulse 1s ease-in-out infinite; }
  @keyframes passPulse { 50% { transform:scale(1.08); } }
  .log { background:#1f2937; border-radius:12px; padding:10px; max-height:180px; overflow-y:auto; font-size:.85rem; color:#d1d5db; }
  .log div { padding:2px 0; border-bottom:1px solid #374151; }
  .setup { max-width:500px; margin:40px auto; background:#1f2937; padding:24px; border-radius:12px; }
  .setup label { display:block; margin:10px 0 4px; font-size:.9rem; }
  .setup select, .setup input[type=select] { width:100%; padding:8px; border-radius:6px; border:1px solid #4b5563; background:#111827; color:#f3f4f6; }
  .recipe { color:#9ca3af; font-size:.8rem; margin-top:2px; }
</style>
</head>
<body>
<div class="panel" id="setup">
  <h1>⚔️ Button Men</h1>
  <div class="sub">Beat people up! Captured dice score full size; kept dice score half (rounded up). First to 3 rounds wins.</div>
  <div class="setup">
    <label>Player 1 Button</label>
    <select id="btn1"></select><div class="recipe" id="rec1"></div>
    <label style="margin-top:12px">Player 2 Button</label>
    <select id="btn2"></select><div class="recipe" id="rec2"></div>
    <label style="margin-top:12px"><input type="checkbox" id="ai" checked> Player 2 played by the computer</label>
    <label style="margin-top:12px">Computer difficulty</label>
    <select id="diff">
      <option value="easy">Easy — random attacks</option>
      <option value="normal" selected>Normal — greedy: grabs the biggest die</option>
      <option value="hard">Hard — looks ahead one move</option>
    </select>
    <div style="margin-top:16px"><button class="primary" style="width:100%" onclick="startGame()">Fight!</button></div>
  </div>
</div>

<div class="panel" id="game" style="display:none">
  <div class="board">
    <div class="player p1" id="p1box">
      <h2><span id="p1name"></span><span class="score" id="p1score"></span></h2>
      <div class="dice" id="p1dice"></div>
    </div>
    <div class="player p2" id="p2box">
      <h2><span id="p2name"></span><span class="score" id="p2score"></span></h2>
      <div class="dice" id="p2dice"></div>
    </div>
  </div>
  <div class="status" id="status"></div>
  <div class="controls">
    <button onclick="clearSel()">Clear selection</button>
    <button id="passBtn" onclick="doPass()">Pass</button>
    <button onclick="newGame()">Quit / New game</button>
  </div>
  <div class="log" id="log"></div>
</div>

<script>
// Buttons use only d4, d6, d8, d12, d20 as requested.
const BUTTON_LIST = {
  "Sawblade": { dice:[4,6,8,12,20], desc:"Balanced starter recipe." },
  "Bauer":    { dice:[4,4,6,12,20], desc:"Two d4s — great for skill attacks." },
  "Stark":    { dice:[4,6,6,12,20], desc:"Twin d6s for clever sums." },
  "Manuel":   { dice:[6,8,8,12,20], desc:"Midweight bruiser." },
  "Grist":    { dice:[4,8,8,20,20], desc:"Huge dice, few tricks." },
  "Igor":     { dice:[4,4,4,12,20], desc:"The d4 swarm — maximum flexibility." },
  "Kublai":   { dice:[6,8,12,12,20], desc:"Steady heavyweight." },
  "Tesla":    { dice:[4,4,8,8,20], desc:"Pairs of dice, tricky sums." },
};

let G = null;

function roll(sides) { return 1 + Math.floor(Math.random() * sides); }

function buildSelect(id) {
  const s = document.getElementById(id);
  for (const name in BUTTON_LIST) {
    const o = document.createElement("option");
    o.value = name; o.textContent = name + " — " + BUTTON_LIST[name].dice.join(",");
    s.appendChild(o);
  }
}

function makePlayer(name, btnName) {
  return {
    name, btnName,
    dice: BUTTON_LIST[btnName].dice.map(s => ({ sides:s, value:roll(s), captured:false })),
    rounds:0, captured:[]
  };
}

function startGame() {
  G = {
    p1: makePlayer("Player 1", document.getElementById("btn1").value),
    p2: makePlayer(document.getElementById("ai").checked ? "Computer" : "Player 2", document.getElementById("btn2").value),
    turn:null, sel:[], log:[], round:1, over:false, roundOver:false, aiLevel:document.getElementById("diff").value
  };
  document.getElementById("setup").style.display = "none";
  document.getElementById("game").style.display = "block";
  startRound();
}

function newGame() {
  document.getElementById("game").style.display = "none";
  document.getElementById("setup").style.display = "block";
  G = null;
}

function log(msg) {
  G.log.unshift(msg);
  document.getElementById("log").innerHTML = G.log.map(m => `<div>${m}</div>`).join("");
}

function other(p) { return p === G.p1 ? G.p2 : G.p1; }
function isAI() { return G.p2.name === "Computer"; }

function startRound() {
  // All dice are re-rolled at the start of each round; captured dice return to play.
  G.p1.dice.forEach(d => { d.captured=false; d.value=roll(d.sides); });
  G.p2.dice.forEach(d => { d.captured=false; d.value=roll(d.sides); });
  G.p1.captured = []; G.p2.captured = [];
  G.sel = []; G.roundOver = false;
  log(`— Round ${G.round} — all dice re-rolled.`);
  // Tournament rule: lowest single die goes first; compare next-lowest on ties.
  const vals = p => p.dice.map(d=>d.value).sort((a,b)=>a-b);
  const a = vals(G.p1), b = vals(G.p2);
  G.turn = a[0] < b[0] ? G.p1 : b[0] < a[0] ? G.p2 :
           a[1] < b[1] ? G.p1 : b[1] < a[1] ? G.p2 :
           a[2] < b[2] ? G.p1 : b[2] < a[2] ? G.p2 :
           a[3] < b[3] ? G.p1 : b[3] < a[3] ? G.p2 :
           a[4] < b[4] ? G.p1 : b[4] < a[4] ? G.p2 :
           (Math.random() < 0.5 ? G.p1 : G.p2);
  log(`${G.p1.name}'s dice [${a.join(', ')}] — ${G.p2.name}'s dice [${b.join(', ')}]. Lowest die goes first: ${G.turn.name}.`);
  render();
  if (G.turn === G.p2 && isAI()) setTimeout(aiMove, 700);
}

function render() {
  for (const [i,p] of [[1,G.p1],[2,G.p2]]) {
    document.getElementById(`p${i}name`).textContent = `${p.name} — “${p.btnName}”`;
    const live = p.dice.filter(d=>!d.captured);
    const kept = live.reduce((s,d)=>s+Math.ceil(d.sides/2),0);
    const cap  = p.captured.reduce((s,d)=>s+d.sides,0);
    document.getElementById(`p${i}score`).textContent =
      `Rounds won: ${p.rounds} · Round score: ${cap+kept} (captured ${cap} + kept ${kept})`;
    document.getElementById(`p${i}box`).classList.toggle("active", G && G.turn===p && !G.over && !G.roundOver);
    const box = document.getElementById(`p${i}dice`);
    box.innerHTML = "";
    p.dice.forEach((d, idx) => {
      const el = document.createElement("div");
      const selected = G.sel.some(s => s.p===p && s.idx===idx);
      const targeted = G.targetIdx === idx && p === other(G.turn);
      const rerolled = (G.lastRerolled||[]).some(r => r.p===p && r.idx===idx) && !(G.flashDone||[]).includes(p.name+idx);
      el.className = "die" + (d.captured ? " dead" : "") + (selected ? " sel" : "") + (targeted ? " target" : "") + (rerolled ? " rerolled" : "");
      if (d.captured) { el.textContent = "✕"; el.title = "captured by opponent"; }
      else el.innerHTML = `${d.value}<span class="size">d${d.sides}</span>`;
      if (!d.captured && G && !G.over && !G.roundOver) el.onclick = () => selectDie(p, idx);
      if (rerolled) setTimeout(() => { if (G) { G.flashDone = G.flashDone||[]; G.flashDone.push(p.name+idx); } }, 1000);
      box.appendChild(el);
    });
  }
  const st = document.getElementById("status");
  const passBtn = document.getElementById("passBtn");
  passBtn.disabled = !G || G.over || G.roundOver || (G.turn===G.p2 && isAI());
  // Highlight Pass when the current (human) player has no legal attack.
  const stuck = !!(G && !G.over && !G.roundOver && !(G.turn===G.p2 && isAI()) && G.turn && !legalAttacks(G.turn).length);
  passBtn.classList.toggle("alert", stuck);
  if (G.over) {
    const w = G.p1.rounds>=3 ? G.p1 : G.p2;
    st.innerHTML = `<span class="big">🏆 ${w.name} wins the match ${G.p1.rounds}–${G.p2.rounds}!</span>Press “Quit / New game” to play again.`;
  } else if (G.roundOver) {
    st.innerHTML = `<span class="big">Round ${G.round} over.</span>`;
  } else if (stuck) {
    st.innerHTML = `<span class="big">No legal move, please pass.</span>${G.turn.name}: press Pass.`;
  } else {
    const list = G.sel.map(s => s.p.dice[s.idx].value).join(" + ");
    st.innerHTML = `<span class="big">Round ${G.round} — ${G.turn.name}'s turn</span>` +
      (G.sel.length
        ? `Selected ${G.sel.length} of your dice${list?` (${list})`:""}. Now click one of ${other(G.turn).name}'s dice to attack it.`
        : `${G.turn.name}: click one of your dice (Power attack) or several (Skill attack).`);
  }
}

function selectDie(p, idx) {
  if (!G || G.over || G.roundOver || G.aiThinking) return;
  if (p !== G.turn) {
    if (G.sel.length) attemptCapture(p, idx);
    return;
  }
  const found = G.sel.findIndex(s => s.p===p && s.idx===idx);
  if (found >= 0) G.sel.splice(found, 1);
  else G.sel.push({ p, idx });
  render();
}

function clearSel() { if (G) { G.sel = []; render(); } }

function attemptCapture(dp, didx) {
  if (G.aiThinking) return; // never attack during the computer's staged move
  const atk = G.sel.filter(s => s.p === G.turn).map(s => s.p.dice[s.idx]);
  if (!atk.length) return;
  const def = dp.dice[didx];
  if (!def || def.captured) return;
  const sum = atk.reduce((s,d)=>s+d.value,0);
  let type = null;
  if (atk.length === 1 && atk[0].value >= def.value) type = "Power";
  else if (sum === def.value) type = "Skill";
  if (!type) {
    const msg = `This is not a valid attack. ❌ Attacking d${def.sides} (showing ${def.value}) with [${atk.map(d=>d.value).join(", ")}]. Power: one die ≥ target. Skill: dice must sum exactly.`;
    log(msg);
    G.sel = [];
    render();
    document.getElementById("status").innerHTML =
      `<span class="big">This is not a valid attack.</span>Attacked d${def.sides} (showing ${def.value}) with [${atk.map(d=>d.value).join(", ")}]. Power: one die ≥ target. Skill: dice must sum exactly. Selection cleared — try again.`;
    return;
  }
  const used = atk.map(d => d.value); // record values used, before re-rolling
  for (const d of atk) d.value = roll(d.sides);
  G.lastRerolled = atk.map(d => ({ p:G.turn, idx:G.turn.dice.indexOf(d) }));
  def.captured = true;
  G.turn.captured.push(def);
  log(`⚔️ ${G.turn.name} ${type} attack: [${used.join(type==="Skill" ? " + " : ", ")}] captures ${other(G.turn).name}'s d${def.sides} (showing ${def.value}).${type==="Skill" ? " Sum: " + sum + "." : ""} Attacker re-rolled to [${atk.map(d=>d.value).join(", ")}].`);
  G.sel = [];            // highlight expires: dice were used and re-rolled
  G.targetIdx = null;
  render();
  endTurn();
}

function legalAttacks(p) {
  const live = p.dice.filter(d=>!d.captured);
  const foes = other(p).dice.filter(d=>!d.captured);
  const res = [];
  for (const d of live) for (const f of foes)
    if (d.value >= f.value) res.push({type:"Power", a:[d], t:f});
  for (let i=0;i<live.length;i++)
    for (let j=i+1;j<live.length;j++) {
      const s = live[i].value + live[j].value;
      for (const f of foes) if (f.value === s) res.push({type:"Skill", a:[live[i],live[j]], t:f});
      for (let k=j+1;k<live.length;k++) {
        const s2 = s + live[k].value;
        for (const f of foes) if (f.value === s2) res.push({type:"Skill", a:[live[i],live[j],live[k]], t:f});
      }
    }
  return res;
}

function endTurn() {
  const l1 = G.p1.dice.some(d=>!d.captured);
  const l2 = G.p2.dice.some(d=>!d.captured);
  if (!l1 || !l2) { endRound(); return; }
  G.turn = other(G.turn);
  render();
  if (G.turn === G.p2 && isAI()) setTimeout(aiMove, 700);
}

function endRound() {
  G.roundOver = true;
  const score = p => p.captured.reduce((s,d)=>s+d.sides,0)
                   + p.dice.filter(d=>!d.captured).reduce((s,d)=>s+Math.ceil(d.sides/2),0);
  const s1 = score(G.p1), s2 = score(G.p2);
  let msg = `Round ${G.round}: ${G.p1.name} ${s1} — ${G.p2.name} ${s2}. `;
  if (s1 > s2) { G.p1.rounds++; msg += `${G.p1.name} wins the round!`; }
  else if (s2 > s1) { G.p2.rounds++; msg += `${G.p2.name} wins the round!`; }
  else msg += "Draw — this round will be replayed.";
  log(msg);
  if (G.p1.rounds >= 3 || G.p2.rounds >= 3) { G.over = true; render(); return; }
  render();
  document.getElementById("status").innerHTML =
    `<span class="big">${msg}</span><button class="primary" onclick="nextRound()">Next round</button> All dice will be re-rolled for the new round.`;
}

function nextRound() { G.round++; startRound(); }

function doPass() {
  if (!G || G.over || G.roundOver) return;
  if (!legalAttacks(G.turn).length) {
    log(`${G.turn.name} passes (no legal attack).`);
    const o = other(G.turn);
    if (!legalAttacks(o).length) { log("Both players passed — round ends."); endRound(); return; }
    G.turn = o; render();
    if (G.turn===G.p2 && isAI()) setTimeout(aiMove, 700);
  } else {
    log(`${G.turn.name} tried to pass but a legal attack exists. Attack or use dice so no attack is possible.`);
  }
}

// The AI's move is played in three visible stages so a human can follow:
// 1. highlight the dice it picks, 2. highlight the target, 3. resolve.
const AI_STEP_MS = 900;

// Best single capture the player could make, as die size (0 if none).
function bestReplySize(p) {
  const atks = legalAttacks(p);
  return atks.reduce((m, a) => Math.max(m, a.t.sides), 0);
}

function chooseAIAttack(atks) {
  if (G.aiLevel === "easy") {
    return atks[Math.floor(Math.random() * atks.length)];
  }
  if (G.aiLevel === "normal") {
    // Greedy: biggest captured die first, prefers Power, cheapest attackers.
    return atks.slice().sort((x,y) =>
      (y.t.sides - x.t.sides) ||
      ((y.type === "Power") - (x.type === "Power")) ||
      (x.a.length - y.a.length)
    )[0];
  }
  // Hard: for each candidate, simulate it and subtract the opponent's best
  // reply. Bonus when the move leaves the opponent with no legal attack.
  return atks.map(a => {
    const savedVals = a.a.map(d => d.value);
    const wasCaptured = a.t.captured;
    a.t.captured = true;
    for (const d of a.a) d.value = roll(d.sides);
    const reply = bestReplySize(G.p1);
    const noReply = reply === 0;
    a.a.forEach((d, i) => d.value = savedVals[i]); // restore
    a.t.captured = wasCaptured;
    // Value of what we capture now, minus what the opponent can grab back.
    // Capturing a die the opponent would rather keep (big dice) is worth more.
    const score = a.t.sides - reply + (noReply ? 12 : 0);
    return { a, score };
  }).sort((x,y) => y.score - x.score)[0].a;
}

function aiMove() {
  if (!G || G.over || G.roundOver || G.turn !== G.p2) return;
  const atks = legalAttacks(G.p2);
  if (!atks.length) { G.aiThinking = false; doPass(); return; }
  const best = chooseAIAttack(atks);
  G.aiThinking = true;
  // Stage 1: show the attacker dice as selected.
  G.sel = best.a.map(d => ({ p:G.p2, idx:G.p2.dice.indexOf(d) }));
  render();
  document.getElementById("status").innerHTML =
    `<span class="big">Computer is choosing dice…</span>Watch the highlighted dice.`;
  // Stage 2: highlight the target.
  setTimeout(() => {
    if (!G || G.turn !== G.p2) { G.aiThinking = false; return; }
    G.targetIdx = G.p2 === G.p1 ? -1 : G.p1.dice.indexOf(best.t);
    render();
    document.getElementById("status").innerHTML =
      `<span class="big">Computer ${best.type} attack on d${best.t.sides} (${best.t.value})…</span>`;
    // Stage 3: resolve the attack.
    setTimeout(() => {
      G.aiThinking = false; G.targetIdx = null;
      if (!G || G.turn !== G.p2 || G.over || G.roundOver) return;
      const used = best.a.map(d => d.value); // values used, before re-rolling
      for (const d of best.a) d.value = roll(d.sides);
      G.lastRerolled = best.a.map(d => ({ p:G.p2, idx:G.p2.dice.indexOf(d) }));
      best.t.captured = true;
      G.p2.captured.push(best.t);
      log(`🤖 Computer ${best.type} attack: [${used.join(best.type==="Skill" ? " + " : ", ")}] captures ${G.p1.name}'s d${best.t.sides} (showing ${best.t.value}).${best.type==="Skill" ? " Sum: " + used.reduce((s,v)=>s+v,0) + "." : ""} Computer re-rolled to [${best.a.map(d=>d.value).join(", ")}].`);
      endTurn();
    }, AI_STEP_MS);
  }, AI_STEP_MS);
}

buildSelect("btn1");
buildSelect("btn2");
document.getElementById("btn1").value = "Sawblade";
document.getElementById("btn2").value = "Grist";
</script>
</body>
</html>
