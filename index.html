<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M4A Audio Player & Host</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .player-container {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 700;
        }

        /* Upload Area */
        .upload-section {
            border: 2px dashed #475569;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s ease;
            margin-bottom: 25px;
        }

        .upload-section:hover {
            border-color: var(--accent-color);
        }

        .upload-section p {
            margin: 0;
            color: var(--text-muted);
            font-size: 14px;
        }

        #file-input {
            display: none;
        }

        /* Audio Core Elements */
        audio {
            width: 100%;
            margin-top: 15px;
            border-radius: 8px;
            display: none; /* Hidden unless a track is ready */
        }

        .now-playing {
            text-align: center;
            margin-bottom: 20px;
            min-height: 45px;
        }

        .track-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-status {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Custom Audio Wrapper showing native controls cleanly */
        .audio-wrapper {
            background: #111827;
            padding: 10px;
            border-radius: 12px;
            margin-bottom: 25px;
            display: none;
        }

        .audio-wrapper.active {
            display: block;
        }

        .audio-wrapper audio {
            display: block;
        }

        /* Playlist Styles */
        .playlist-header {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 10px;
            font-weight: 600;
        }

        .playlist {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 200px;
            overflow-y: auto;
        }

        .playlist-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .playlist-item:hover {
            background-color: #334155;
        }

        .playlist-item.playing {
            border-color: var(--accent-color);
            background-color: rgba(59, 130, 246, 0.1);
        }

        .playlist-item-name {
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 85%;
        }

        .play-icon {
            color: var(--accent-color);
            font-size: 12px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <h1>M4A Web Player</h1>
        
        <!-- Local File Loader -->
        <div class="upload-section" onclick="document.getElementById('file-input').click()">
            <p>🎵 Click to select or drop <b>.m4a</b> files</p>
            <input type="file" id="file-input" accept=".m4a" multiple>
        </div>

        <!-- Metadata & Status Area -->
        <div class="now-playing">
            <div class="track-title" id="current-title">No track selected</div>
            <div class="track-status" id="current-status">Upload a file to start listening</div>
        </div>

        <!-- Native browser audio player component wrapper -->
        <div class="audio-wrapper" id="player-wrapper">
            <audio id="audio-player" controls></audio>
        </div>

        <!-- Tracks List -->
        <div class="playlist-header">Your Tracks</div>
        <ul class="playlist" id="playlist-container">
            <!-- Dynamic list objects append here -->
        </ul>
    </div>

    <script>
        const fileInput = document.getElementById('file-input');
        const audioPlayer = document.getElementById('audio-player');
        const playerWrapper = document.getElementById('player-wrapper');
        const playlistContainer = document.getElementById('playlist-container');
        const currentTitle = document.getElementById('current-title');
        const currentStatus = document.getElementById('current-status');

        let tracks = [];
        let currentTrackIndex = null;

        // Handle file selection
        fileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            
            files.forEach(file => {
                // Generate a temporary local URL for the object block memory
                const trackUrl = URL.createObjectURL(file);
                
                tracks.push({
                    name: file.name,
                    url: trackUrl
                });
            });

            renderPlaylist();

            if (currentTrackIndex === null && tracks.length > 0) {
                playTrack(0);
            }
        });

        // Generate clean template markup for items
        function renderPlaylist() {
            playlistContainer.innerHTML = '';
            tracks.forEach((track, index) => {
                const li = document.createElement('li');
                li.className = `playlist-item ${index === currentTrackIndex ? 'playing' : ''}`;
                li.onclick = () => playTrack(index);

                li.innerHTML = `
                    <span class="playlist-item-name">${track.name}</span>
                    ${index === currentTrackIndex ? '<span class="play-icon">▶ NOW PLAYING</span>' : ''}
                `;
                playlistContainer.appendChild(li);
            });
        }

        // Handle Audio Playback Initialization
        function playTrack(index) {
            if (index < 0 || index >= tracks.length) return;

            currentTrackIndex = index;
            const track = tracks[index];

            // Assign URL to audio pipeline
            audioPlayer.src = track.url;
            currentTitle.textContent = track.name;
            currentStatus.textContent = "Playing...";
            
            playerWrapper.classList.add('active');
            renderPlaylist();

            audioPlayer.play().catch(error => {
                console.log("Playback interaction required:", error);
                currentStatus.textContent = "Paused (Click play below)";
            });
        }

        // Listen for track ending to skip to the next track automatically
        audioPlayer.addEventListener('ended', () => {
            if (currentTrackIndex + 1 < tracks.length) {
                playTrack(currentTrackIndex + 1);
            } else {
                currentStatus.textContent = "Finished playing playlist";
            }
        });
    </script>
</body>
</html>
