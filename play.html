<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audiobook Player</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, sans-serif; background:#12141a; color:#e8e8ee;
         max-width: 640px; margin: 0 auto; padding: 1.5rem; }
  h1 { font-size: 1.4rem; margin: 0 0 .3rem; }
  .book { color:#9aa; margin-bottom: 1rem; }
  .chapter { display:flex; align-items:center; gap:.75rem;
             padding:.65rem .9rem; border-radius:10px; cursor:pointer;
             border:1px solid #2a2d38; margin-bottom:.4rem; background:#1a1d26; }
  .chapter:hover { background:#22262f; }
  .chapter.active { border-color:#6ea8ff; background:#1c2740; }
  .num { color:#889; min-width:2.2em; text-align:right; font-variant-numeric:tabular-nums; }
  .title { flex:1; }
  .dur { color:#889; font-size:.85rem; }
  .playing-icon { display:none; }
  .chapter.active .playing-icon { display:inline; }
  #controls { position:sticky; bottom:0; background:#12141a; padding:.8rem 0; }
  #progress { width:100%; }
  #row { display:flex; gap:.8rem; align-items:center; justify-content:center; margin-top:.4rem; }
  button { background:#2a2d38; color:#e8e8ee; border:none; border-radius:50%;
           width:44px; height:44px; font-size:1.1rem; cursor:pointer; }
  button#play { width:56px; height:56px; background:#6ea8ff; color:#101; font-size:1.3rem; }
  #time { color:#889; font-variant-numeric:tabular-nums; font-size:.9rem; }
  .speed { background:#2a2d38; color:#e8e8ee; border:none; border-radius:8px;
           padding:.4rem .7rem; cursor:pointer; }
</style>
</head>
<body>
<h1 id="bookTitle">Audiobook</h1>
<p class="book" id="bookAuthor"></p>
<div id="list"></div>

<div id="controls">
  <input type="range" id="progress" value="0" min="0" max="1000" step="1">
  <div id="row">
    <button id="prev" title="Previous chapter">⏮</button>
    <button id="back" title="Back 15s">−15s</button>
    <button id="play" title="Play/Pause">▶</button>
    <button id="fwd" title="Forward 15s">+15s</button>
    <button id="next" title="Next chapter">⏭</button>
    <button class="speed" id="speed" title="Playback speed">1×</button>
  </div>
  <p id="time" style="text-align:center;margin:.4rem 0 0">0:00 / 0:00</p>
</div>

<audio id="audio" preload="metadata"></audio>

<script>
const SPEEDS = [1, 1.25, 1.5, 1.75, 2, 0.75, 0.5];

async function load() {
  const meta = await fetch('playlist.json').then(r => r.json());
  document.getElementById('bookTitle').textContent = meta.title || 'Audiobook';
  document.getElementById('bookAuthor').textContent = meta.author || '';
  const list = document.getElementById('list');
  meta.chapters.forEach((ch, i) => {
    const div = document.createElement('div');
    div.className = 'chapter';
    div.dataset.i = i;
    div.innerHTML = `<span class="num">${i+1}.</span>
      <span class="title">${ch.title}</span>
      <span class="playing-icon">▶</span>
      <span class="dur" data-dur></span>`;
    div.onclick = () => playChapter(i);
    list.appendChild(div);
  });
  return meta.chapters;
}

const audio = document.getElementById('audio');
let chapters = [], current = 0, speeds = [0];

function fmt(s) {
  if (!isFinite(s)) return '0:00';
  s = Math.floor(s);
  const h = Math.floor(s/3600), m = Math.floor(s%3600/60), sec = s%60;
  return (h ? h + ':' + String(m).padStart(2,'0') : m) + ':' + String(sec).padStart(2,'0');
}

function playChapter(i, keepTime = 0) {
  current = i;
  audio.src = chapters[i].file;
  audio.currentTime = keepTime;
  audio.play();
  document.querySelectorAll('.chapter').forEach((el, j) =>
    el.classList.toggle('active', j === i));
  localStorage.setItem('audiobook-pos', i + '|' + keepTime);
}

function updateActive() {
  const el = document.querySelector(`.chapter[data-i="${current}"]`);
  if (el) el.querySelector('.playing-icon').textContent = audio.paused ? '⏸' : '▶';
}

load().then(chs => {
  chapters = chs;
  chapters.forEach((ch, i) => {
    const t = new Audio(ch.file);
    t.addEventListener('loadedmetadata', () => {
      document.querySelector(`.chapter[data-i="${i}"] [data-dur]`).textContent = fmt(t.duration);
    });
  });

  // Resume where you left off
  const saved = localStorage.getItem('audiobook-pos');
  if (saved) {
    const [i, t] = saved.split('|').map(Number);
    if (i < chapters.length) {
      current = i;
      audio.src = chapters[i].file;
      audio.currentTime = t;
      document.querySelector(`.chapter[data-i="${i}"]`)?.classList.add('active');
    }
  } else {
    audio.src = chapters[0].file;
    document.querySelector('.chapter').classList.add('active');
  }
  updateActive();
});

const playBtn = document.getElementById('play');
playBtn.onclick = () => audio.paused ? audio.play() : audio.pause();
audio.onplay = audio.onpause = () => {
  playBtn.textContent = audio.paused ? '▶' : '⏸';
  updateActive();
  if (!audio.paused) localStorage.setItem('audiobook-pos', current + '|' + audio.currentTime);
};
setInterval(() => {
  if (!audio.paused) localStorage.setItem('audiobook-pos', current + '|' + audio.currentTime);
}, 5000);

const prog = document.getElementById('progress');
audio.ontimeupdate = () => {
  if (audio.duration) prog.value = audio.currentTime / audio.duration * 1000;
  document.getElementById('time').textContent =
    fmt(audio.currentTime) + ' / ' + fmt(audio.duration);
  const chEl = document.querySelector(`.chapter[data-i="${current}"]`);
  if (chEl) chEl.querySelector('[data-dur]').textContent = fmt(audio.duration);
};
prog.oninput = () => audio.currentTime = prog.value / 1000 * (audio.duration || 0);

function savePos() { localStorage.setItem('audiobook-pos', current + '|' + audio.currentTime); }
audio.onended = () => { if (current + 1 < chapters.length) playChapter(current + 1); };

document.getElementById('prev').onclick = () => playChapter(Math.max(0, current - 1));
document.getElementById('next').onclick = () => playChapter(Math.min(chapters.length - 1, current + 1));
document.getElementById('back').onclick = () => { audio.currentTime = Math.max(0, audio.currentTime - 15); savePos(); };
document.getElementById('fwd').onclick  = () => { audio.currentTime = Math.min(audio.duration, audio.currentTime + 15); savePos(); };

document.getElementById('speed').onclick = (e) => {
  speeds[0] = (speeds[0] + 1) % SPEEDS.length;
  audio.playbackRate = SPEEDS[speeds[0]];
  e.target.textContent = SPEEDS[speeds[0]] + '×';
};

document.addEventListener('keydown', e => {
  if (e.key === ' ') { e.preventDefault(); playBtn.click(); }
  if (e.key === 'ArrowRight') document.getElementById('fwd').click();
  if (e.key === 'ArrowLeft') document.getElementById('back').click();
});
</script>
</body>
</html>
