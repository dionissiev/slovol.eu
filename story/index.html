<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chain Story Platform - SlovoL Theme</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- React & React DOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  
  <!-- Babel Compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      --bg: #111827;          
      --surface: #1f2937;     
      --surface-2: #374151;   
      --border: #4b5563;      
      --text: #f3f4f6;        
      --text-body: #d1d5db;   
      --text-muted: #9ca3af;  
      --text-faint: #4b5563;  
      --accent: #fbbf24;      
      --accent-soft: #fde68a; 
      --success: #a3e635;     
      --danger: #ef4444;      
      --danger-text: #f87171; 
      --radius-card: 12px;
      --radius-modal: 16px;
      --radius-btn: 8px;
      --radius-field: 6px;
      --radius-pill: 999px;
      --shadow-modal: 0 16px 48px rgba(0, 0, 0, .65);
      --overlay: rgba(0, 0, 0, .72);
      --nav-bg: rgba(17, 24, 39, .92);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 90px;
    }

    .slovol-card {
      background: var(--surface);
      border-radius: var(--radius-card);
      padding: 16px;
      border: 2px solid var(--surface-2);
    }

    .slovol-card.active { border-color: var(--accent); }
    .slovol-card.complete { border-color: var(--success); }

    .slovol-btn {
      background: var(--surface-2);
      color: var(--text);
      border: none;
      border-radius: var(--radius-btn);
      padding: 8px 16px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .slovol-btn:hover:not(:disabled) { background: var(--border); }
    .slovol-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .slovol-btn-primary {
      background: var(--accent);
      color: #111827;
      font-weight: 700;
    }

    .slovol-btn-primary:hover:not(:disabled) { background: #f59e0b; }

    .slovol-input, .slovol-select, .slovol-textarea {
      width: 100%;
      padding: 8px 12px;
      border-radius: var(--radius-field);
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-family: inherit;
    }

    .slovol-input:focus, .slovol-select:focus, .slovol-textarea:focus, button:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    .slovol-chip {
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      background: #334155;
      color: #e5e7eb;
      border: 1px solid var(--border);
    }

    .slovol-chip-amber {
      background: #78350f;
      color: #fde68a;
      border-color: #d97706;
    }

    .slovol-chip-lime {
      background: #14532d;
      color: #bef264;
      border-color: #65a30d;
    }

    .slovol-quote {
      padding: 10px 14px;
      border-left: 3px solid var(--accent);
      background: var(--bg);
      border-radius: 0 8px 8px 0;
      font-style: italic;
      color: var(--accent-soft);
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--surface-2); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--border); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;

    const FeatherIcon = () => (
      <svg className="w-5 h-5 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
      </svg>
    );

    const UserIcon = () => (
      <svg className="w-4 h-4 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
      </svg>
    );

    const MOCK_USERS = [
      { id: 'u1', username: 'Elena_Writer', email: 'elena@example.com', isVerified: true },
      { id: 'u2', username: 'Marco_Polo', email: 'marco@example.com', isVerified: true },
      { id: 'u3', username: 'Sarah_K', email: 'sarah@example.com', isVerified: true },
    ];

    const INITIAL_STORIES = [
      {
        id: 'story-1',
        title: 'The Nebula Artifact',
        description: 'A sci-fi collaborative chronicle set on an abandoned space station near Jupiter.',
        creatorId: 'u1',
        limitType: 'word',
        limitValue: 60,
        turnLimit: 6,
        isClosed: true,
        allowedUsers: ['u1', 'u2', 'u3'],
        turnOrderType: 'fixed',
        consecutiveMode: 'not_allowed', // 'not_allowed' | 'author_only' | 'any'
        isAnonymous: false,
        entries: [
          {
            id: 'e1',
            authorId: 'u1',
            authorName: 'Elena_Writer',
            content: 'The airlock hissed softly as Commander Vance stepped into the cavernous hangar of Station Orion. Dust motes drifted through the amber sunlight flickering through damaged solar viewports.',
            timestamp: '10 mins ago',
            wordCount: 29,
            symbolCount: 187
          }
        ]
      }
    ];

    function App() {
      const [currentUser, setCurrentUser] = useState(MOCK_USERS[0]);
      const [isLoggedIn, setIsLoggedIn] = useState(true);
      const [stories, setStories] = useState(INITIAL_STORIES);
      const [activeStoryId, setActiveStoryId] = useState(INITIAL_STORIES[0].id);
      const [activeTab, setActiveTab] = useState('browse');

      // Creation Form State
      const [newTitle, setNewTitle] = useState('');
      const [newDesc, setNewDesc] = useState('');
      const [limitType, setLimitType] = useState('word');
      const [limitValue, setLimitValue] = useState(50);
      const [turnLimit, setTurnLimit] = useState('');
      const [isClosed, setIsClosed] = useState(false);
      const [selectedUsers, setSelectedUsers] = useState([MOCK_USERS[0].id]);
      const [turnOrderType, setTurnOrderType] = useState('free');
      const [consecutiveMode, setConsecutiveMode] = useState('not_allowed');
      const [isAnonymous, setIsAnonymous] = useState(false);
      const [initialPrompt, setInitialPrompt] = useState('');

      // Editor State
      const [newTurnText, setNewTurnText] = useState('');

      const activeStory = useMemo(() => {
        return stories.find(s => s.id === activeStoryId) || stories[0];
      }, [stories, activeStoryId]);

      // Prompt Word & Symbol Counters
      const initialPromptWordCount = useMemo(() => {
        const trimmed = initialPrompt.trim();
        return trimmed ? trimmed.split(/\s+/).length : 0;
      }, [initialPrompt]);

      const initialPromptSymbolCount = initialPrompt.length;

      // Active Workspace Counters
      const currentWordCount = useMemo(() => {
        const trimmed = newTurnText.trim();
        return trimmed ? trimmed.split(/\s+/).length : 0;
      }, [newTurnText]);

      const currentSymbolCount = newTurnText.length;

      // Creation Validation Check
      const creationValidation = useMemo(() => {
        if (!initialPrompt.trim()) return { canCreate: false, reason: 'Initial prompt is required.' };
        if (limitType === 'word' && initialPromptWordCount > Number(limitValue)) {
          return { canCreate: false, reason: `Prompt exceeds limit (${initialPromptWordCount}/${limitValue} words)` };
        }
        if (limitType === 'symbol' && initialPromptSymbolCount > Number(limitValue)) {
          return { canCreate: false, reason: `Prompt exceeds limit (${initialPromptSymbolCount}/${limitValue} symbols)` };
        }
        return { canCreate: true, reason: '' };
      }, [initialPrompt, limitType, limitValue, initialPromptWordCount, initialPromptSymbolCount]);

      // Turn Validation Check
      const turnValidation = useMemo(() => {
        if (!isLoggedIn) return { canPost: false, reason: 'You must be logged in to post.' };
        if (!activeStory) return { canPost: false, reason: 'No story selected.' };

        if (activeStory.turnLimit && activeStory.entries.length >= activeStory.turnLimit) {
          return { canPost: false, reason: 'This story has reached its maximum allowed turn count.' };
        }

        if (activeStory.isClosed && !activeStory.allowedUsers.includes(currentUser.id)) {
          return { canPost: false, reason: 'This story is restricted to invited authors.' };
        }

        // Consecutive Entry Rule Evaluation
        const lastEntry = activeStory.entries[activeStory.entries.length - 1];
        if (lastEntry && lastEntry.authorId === currentUser.id && activeStory.entries.length > 0) {
          const mode = activeStory.consecutiveMode || 'not_allowed';
          if (mode === 'not_allowed') {
            return { canPost: false, reason: 'Consecutive turns are not allowed in this story. Wait for another participant.' };
          } else if (mode === 'author_only' && activeStory.creatorId !== currentUser.id) {
            return { canPost: false, reason: 'Consecutive turns are only permitted for the story creator.' };
          }
        }

        if (activeStory.isClosed && activeStory.turnOrderType === 'fixed') {
          const nextIndex = activeStory.entries.length % activeStory.allowedUsers.length;
          const expectedUserId = activeStory.allowedUsers[nextIndex];
          if (currentUser.id !== expectedUserId) {
            const expectedUser = MOCK_USERS.find(u => u.id === expectedUserId);
            return { canPost: false, reason: `It is currently ${expectedUser?.username || 'another user'}'s turn.` };
          }
        }

        if (activeStory.limitType === 'word' && currentWordCount > activeStory.limitValue) {
          return { canPost: false, reason: `Word limit exceeded (${currentWordCount}/${activeStory.limitValue} words).` };
        }
        if (activeStory.limitType === 'symbol' && currentSymbolCount > activeStory.limitValue) {
          return { canPost: false, reason: `Symbol limit exceeded (${currentSymbolCount}/${activeStory.limitValue} characters).` };
        }

        if (currentSymbolCount === 0) {
          return { canPost: false, reason: 'Write your entry before posting.' };
        }

        return { canPost: true, reason: 'Ready to post!' };
      }, [isLoggedIn, activeStory, currentUser, currentWordCount, currentSymbolCount]);

      const handleCreateStory = (e) => {
        e.preventDefault();
        if (!creationValidation.canCreate) return;

        const finalAllowed = Array.from(new Set([currentUser.id, ...selectedUsers]));

        const newStoryObj = {
          id: `story-${Date.now()}`,
          title: newTitle.trim() || 'Untitled Chain Story',
          description: newDesc.trim() || 'No description provided.',
          creatorId: currentUser.id,
          limitType,
          limitValue: Number(limitValue),
          turnLimit: turnLimit ? Number(turnLimit) : null,
          isClosed,
          allowedUsers: isClosed ? finalAllowed : [],
          turnOrderType: isClosed ? turnOrderType : 'free',
          consecutiveMode,
          isAnonymous: (isClosed && turnOrderType === 'fixed') ? false : isAnonymous,
          entries: [
            {
              id: `entry-${Date.now()}`,
              authorId: currentUser.id,
              authorName: isAnonymous ? 'Anonymous Author' : currentUser.username,
              content: initialPrompt.trim(),
              timestamp: 'Just now',
              wordCount: initialPromptWordCount,
              symbolCount: initialPromptSymbolCount
            }
          ]
        };

        setStories([newStoryObj, ...stories]);
        setActiveStoryId(newStoryObj.id);
        setActiveTab('read');

        setNewTitle('');
        setNewDesc('');
        setInitialPrompt('');
      };

      const handlePostTurn = () => {
        if (!turnValidation.canPost) return;

        const newEntry = {
          id: `entry-${Date.now()}`,
          authorId: currentUser.id,
          authorName: activeStory.isAnonymous ? 'Anonymous Author' : currentUser.username,
          content: newTurnText.trim(),
          timestamp: 'Just now',
          wordCount: currentWordCount,
          symbolCount: currentSymbolCount
        };

        const updated = stories.map(s => {
          if (s.id === activeStory.id) {
            return { ...s, entries: [...s.entries, newEntry] };
          }
          return s;
        });

        setStories(updated);
        setNewTurnText('');
      };

      return (
        <div className="max-w-4xl mx-auto px-4 py-6">
          <header className="flex flex-col md:flex-row items-center justify-between gap-4 mb-6 pb-4 border-b border-gray-700">
            <div>
              <h1 className="text-2xl font-bold text-amber-400 flex items-center gap-2">
                <FeatherIcon /> SlovoL Chain Stories
              </h1>
              <p className="text-xs text-gray-400 mt-1">Collaborative Writing Engine</p>
            </div>

            <div className="flex items-center gap-3">
              <div className="flex items-center gap-2 bg-gray-800 px-3 py-1.5 rounded-lg border border-gray-700">
                <UserIcon />
                <span className="text-xs font-semibold text-gray-200">{currentUser.username}</span>
                <span className="slovol-chip slovol-chip-lime text-[10px]">Active</span>
              </div>
            </div>
          </header>

          <div className="flex gap-2 mb-6 overflow-x-auto pb-2 border-b border-gray-800">
            <button onClick={() => setActiveTab('browse')} className={`slovol-btn ${activeTab === 'browse' ? 'slovol-btn-primary' : ''}`}>Browse</button>
            <button onClick={() => setActiveTab('read')} className={`slovol-btn ${activeTab === 'read' ? 'slovol-btn-primary' : ''}`}>Workspace</button>
            <button onClick={() => setActiveTab('create')} className={`slovol-btn ${activeTab === 'create' ? 'slovol-btn-primary' : ''}`}>+ New Story</button>
          </div>

          {/* BROWSE TAB */}
          {activeTab === 'browse' && (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              {stories.map(s => (
                <div key={s.id} className="slovol-card flex flex-col justify-between">
                  <div>
                    <h3 className="font-bold text-amber-400 text-lg mb-1">{s.title}</h3>
                    <p className="text-xs text-gray-300 mb-3">{s.description}</p>
                    <div className="flex flex-wrap gap-2 text-xs mb-4">
                      <span className="slovol-chip slovol-chip-amber">Limit: {s.limitValue} {s.limitType}s</span>
                      <span className="slovol-chip">{s.consecutiveMode === 'not_allowed' ? 'No Consecutive Turns' : s.consecutiveMode === 'author_only' ? 'Creator Consecutive Allowed' : 'Any Consecutive Allowed'}</span>
                    </div>
                  </div>
                  <button onClick={() => { setActiveStoryId(s.id); setActiveTab('read'); }} className="slovol-btn text-xs w-full">View Story →</button>
                </div>
              ))}
            </div>
          )}

          {/* WORKSPACE TAB */}
          {activeTab === 'read' && activeStory && (
            <div className="space-y-6">
              <div className="slovol-card">
                <h2 className="text-xl font-bold text-amber-400 mb-1">{activeStory.title}</h2>
                <p className="text-xs text-gray-300">{activeStory.description}</p>
              </div>

              <div className="space-y-4">
                {activeStory.entries.map((entry, idx) => (
                  <div key={entry.id} className="slovol-card">
                    <div className="flex justify-between items-center mb-2 pb-2 border-b border-gray-700">
                      <span className="text-xs font-semibold text-amber-300">#{idx + 1} — {entry.authorName}</span>
                      <span className="text-[11px] text-gray-400">{entry.timestamp}</span>
                    </div>
                    <p className="text-sm text-gray-200 leading-relaxed whitespace-pre-line">{entry.content}</p>
                  </div>
                ))}
              </div>

              {/* Contributor Editor */}
              <div className="slovol-card border-amber-500/50">
                <h3 className="text-sm font-bold text-amber-400 mb-2">Contribute Next Turn</h3>
                
                {!turnValidation.canPost ? (
                  <div className="slovol-quote text-xs text-red-300 border-red-500 my-2">{turnValidation.reason}</div>
                ) : (
                  <div className="slovol-quote text-xs text-lime-300 border-lime-500 my-2">Ready to post! Limit: {activeStory.limitValue} {activeStory.limitType}s.</div>
                )}

                <textarea
                  value={newTurnText}
                  onChange={(e) => setNewTurnText(e.target.value)}
                  rows={4}
                  placeholder="Type your story entry here..."
                  className="slovol-textarea mt-2 text-sm"
                ></textarea>

                <div className="flex flex-col sm:flex-row items-center justify-between gap-4 mt-4 pt-3 border-t border-gray-700">
                  <div className="flex items-center gap-4 text-xs font-mono">
                    <div className={activeStory.limitType === 'word' && currentWordCount > activeStory.limitValue ? 'text-red-400 font-bold' : 'text-gray-300'}>
                      Words: <span className="text-amber-400 font-bold">{currentWordCount}</span> / {activeStory.limitType === 'word' ? activeStory.limitValue : '∞'}
                    </div>
                    <div className={activeStory.limitType === 'symbol' && currentSymbolCount > activeStory.limitValue ? 'text-red-400 font-bold' : 'text-gray-300'}>
                      Symbols: <span className="text-amber-400 font-bold">{currentSymbolCount}</span> / {activeStory.limitType === 'symbol' ? activeStory.limitValue : '∞'}
                    </div>
                  </div>

                  <button onClick={handlePostTurn} disabled={!turnValidation.canPost} className="slovol-btn slovol-btn-primary w-full sm:w-auto">
                    Post Turn
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* CREATE TAB */}
          {activeTab === 'create' && (
            <div className="slovol-card">
              <h2 className="text-lg font-bold text-amber-400 mb-4">Launch a New Chain Story</h2>
              <form onSubmit={handleCreateStory} className="space-y-4 text-xs">
                <div>
                  <label className="block mb-1 text-gray-300 font-medium">Story Title (Optional)</label>
                  <input type="text" value={newTitle} onChange={(e) => setNewTitle(e.target.value)} placeholder="e.g., The Shadow Over Dunwich" className="slovol-input" />
                </div>

                <div>
                  <label className="block mb-1 text-gray-300 font-medium">Description (Optional)</label>
                  <input type="text" value={newDesc} onChange={(e) => setNewDesc(e.target.value)} placeholder="Brief premise..." className="slovol-input" />
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div>
                    <label className="block mb-1 text-gray-300 font-medium">Count Metric (Mandatory)</label>
                    <select value={limitType} onChange={(e) => setLimitType(e.target.value)} className="slovol-select">
                      <option value="word">Word Count Limit</option>
                      <option value="symbol">Symbol/Character Limit</option>
                    </select>
                  </div>
                  <div>
                    <label className="block mb-1 text-gray-300 font-medium">Limit Value Per Turn (Mandatory)</label>
                    <input type="number" min="5" value={limitValue} onChange={(e) => setLimitValue(e.target.value)} required className="slovol-input" />
                  </div>
                </div>

                {/* Consecutive Entries Setting */}
                <div className="p-3 bg-gray-900/60 rounded-lg border border-gray-700">
                  <label className="block mb-2 font-bold text-amber-400">Consecutive Entries Rule</label>
                  <select value={consecutiveMode} onChange={(e) => setConsecutiveMode(e.target.value)} className="slovol-select">
                    <option value="not_allowed">Not Allowed (Default - strict alternating turns)</option>
                    <option value="author_only">Allowed for Creator Only</option>
                    <option value="any">Allowed for Any Contributor</option>
                  </select>
                </div>

                <div>
                  <label className="block mb-1 text-gray-300 font-medium">Initial Story Prompt (Mandatory)</label>
                  <textarea
                    rows={4}
                    value={initialPrompt}
                    onChange={(e) => setInitialPrompt(e.target.value)}
                    required
                    placeholder="Write the opening lines of your chain story..."
                    className="slovol-textarea"
                  ></textarea>
                </div>

                {/* Creation Form Counter & Action Bar */}
                <div className="flex flex-col sm:flex-row items-center justify-between gap-4 pt-3 border-t border-gray-700">
                  <div className="flex items-center gap-4 text-xs font-mono">
                    <div className={limitType === 'word' && initialPromptWordCount > Number(limitValue) ? 'text-red-400 font-bold' : 'text-gray-300'}>
                      Words: <span className="text-amber-400 font-bold">{initialPromptWordCount}</span> / {limitType === 'word' ? limitValue : '∞'}
                    </div>
                    <div className={limitType === 'symbol' && initialPromptSymbolCount > Number(limitValue) ? 'text-red-400 font-bold' : 'text-gray-300'}>
                      Symbols: <span className="text-amber-400 font-bold">{initialPromptSymbolCount}</span> / {limitType === 'symbol' ? limitValue : '∞'}
                    </div>
                  </div>

                  <button type="submit" disabled={!creationValidation.canCreate} className="slovol-btn slovol-btn-primary w-full sm:w-auto py-2">
                    Create Story
                  </button>
                </div>
                
                {!creationValidation.canCreate && (
                  <p className="text-right text-xs text-red-400 font-semibold">{creationValidation.reason}</p>
                )}
              </form>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
