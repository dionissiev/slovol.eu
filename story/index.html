<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chain Story Platform - SlovoL Theme</title>
  
  <!-- React & React DOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  
  <!-- Babel Compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Supabase JS Client Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #111827;          
      --surface: #1f2937;     
      --surface-2: #374151;   
      --border: #4b5563;      
      --text: #f3f4f6;        
      --text-body: #d1d5db;   
      --text-muted: #9ca3af;  
      --text-faint: #4b5563;  
      --accent: #fbbf24;      
      --accent-soft: #fde68a; 
      --success: #a3e635;     
      --danger: #ef4444;      
      --danger-text: #f87171; 
      --radius-card: 12px;
      --radius-modal: 16px;
      --radius-btn: 8px;
      --radius-field: 6px;
      --radius-pill: 999px;
      --shadow-modal: 0 16px 48px rgba(0, 0, 0, .65);
      --overlay: rgba(0, 0, 0, .72);
      --nav-bg: rgba(17, 24, 39, .92);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 90px;
    }

    .slovol-card {
      background: var(--surface);
      border-radius: var(--radius-card);
      padding: 16px;
      border: 2px solid var(--surface-2);
    }

    .slovol-card.active { border-color: var(--accent); }
    .slovol-card.complete { border-color: var(--success); }

    .slovol-btn {
      background: var(--surface-2);
      color: var(--text);
      border: none;
      border-radius: var(--radius-btn);
      padding: 8px 16px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .slovol-btn:hover:not(:disabled) { background: var(--border); }
    .slovol-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .slovol-btn-primary {
      background: var(--accent);
      color: #111827;
      font-weight: 700;
    }

    .slovol-btn-primary:hover:not(:disabled) { background: #f59e0b; }

    .slovol-input, .slovol-select, .slovol-textarea {
      width: 100%;
      padding: 8px 12px;
      border-radius: var(--radius-field);
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-family: inherit;
    }

    .slovol-input:focus, .slovol-select:focus, .slovol-textarea:focus, button:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    .slovol-chip {
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      background: #334155;
      color: #e5e7eb;
      border: 1px solid var(--border);
    }

    .slovol-chip-amber {
      background: #78350f;
      color: #fde68a;
      border-color: #d97706;
    }

    .slovol-chip-lime {
      background: #14532d;
      color: #bef264;
      border-color: #65a30d;
    }

    .slovol-chip-red {
      background: #7f1d1d;
      color: #fca5a5;
      border-color: #dc2626;
    }

    .slovol-quote {
      padding: 10px 14px;
      border-left: 3px solid var(--accent);
      background: var(--bg);
      border-radius: 0 8px 8px 0;
      font-style: italic;
      color: var(--accent-soft);
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--surface-2); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--border); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    const SUPABASE_URL = 'https://grqjdubikeedbdisvcpq.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_wFor1ik9pKpyHeUnojL4Yw_72mgpHfv';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const FeatherIcon = () => (
      <svg className="w-5 h-5 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
      </svg>
    );

    const UserIcon = () => (
      <svg className="w-4 h-4 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
      </svg>
    );

    function App() {
      const [currentUser, setCurrentUser] = useState(null);
      const [stories, setStories] = useState([]);
      const [activeStoryId, setActiveStoryId] = useState(null);
      const [activeTab, setActiveTab] = useState('browse');
      const [loading, setLoading] = useState(true);

      // Auth state
      const [authEmail, setAuthEmail] = useState('');
      const [authPassword, setAuthPassword] = useState('');
      const [authUsername, setAuthUsername] = useState('');
      const [isSignUp, setIsSignUp] = useState(false);
      const [authMessage, setAuthMessage] = useState('');

      // Story Creation Form State
      const [newTitle, setNewTitle] = useState('');
      const [newDesc, setNewDesc] = useState('');
      const [limitType, setLimitType] = useState('word');
      const [limitValue, setLimitValue] = useState(50);
      const [turnLimit, setTurnLimit] = useState('');
      const [visibility, setVisibility] = useState('open'); // 'open' | 'closed' | 'hidden'
      const [allowedUsersInput, setAllowedUsersInput] = useState(''); // comma-separated usernames/emails
      const [turnOrderType, setTurnOrderType] = useState('free'); // 'free' | 'fixed'
      const [consecutiveMode, setConsecutiveMode] = useState('not_allowed');
      const [isAnonymous, setIsAnonymous] = useState(false);
      const [initialPrompt, setInitialPrompt] = useState('');

      // Editor State
      const [newTurnText, setNewTurnText] = useState('');
      const [notifyOn, setNotifyOn] = useState(false); // per-story email subscription

      useEffect(() => {
        fetchStories();

        supabase.auth.getSession().then(({ data: { session } }) => {
          setCurrentUser(session?.user || null);
          setLoading(false);
        });

        const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
          setCurrentUser(session?.user || null);
        });

        return () => subscription.unsubscribe();
      }, []);

      const fetchStories = async () => {
        setLoading(true);
        const { data, error } = await supabase
          .from('stories')
          .select('*, story_entries(*)')
          .order('created_at', { ascending: false });

        if (error) {
          console.error('Error fetching stories:', error);
        } else if (data) {
          const formatted = data.map(story => ({
            ...story,
            entries: (story.story_entries || []).sort((a, b) => new Date(a.created_at) - new Date(b.created_at))
          }));
          setStories(formatted);
          if (formatted.length > 0 && !activeStoryId) {
            setActiveStoryId(formatted[0].id);
          }
        }
        setLoading(false);
      };

      // Filter stories based on Visibility rules
      const visibleStories = useMemo(() => {
        return stories.filter(s => {
          const vis = s.visibility || 'open';
          if (vis === 'open' || vis === 'closed') return true;
          if (vis === 'hidden') {
            if (!currentUser) return false;
            const isCreator = s.creator_id === currentUser.id;
            const userIdentifier = currentUser.user_metadata?.username || currentUser.email;
            const isAllowed = s.allowed_users && s.allowed_users.includes(userIdentifier);
            return isCreator || isAllowed;
          }
          return true;
        });
      }, [stories, currentUser]);

      const activeStory = useMemo(() => {
        return visibleStories.find(s => s.id === activeStoryId) || visibleStories[0];
      }, [visibleStories, activeStoryId]);

      // Counters
      const initialPromptWordCount = useMemo(() => {
        const trimmed = initialPrompt.trim();
        return trimmed ? trimmed.split(/\s+/).length : 0;
      }, [initialPrompt]);
      const initialPromptSymbolCount = initialPrompt.length;

      const currentWordCount = useMemo(() => {
        const trimmed = newTurnText.trim();
        return trimmed ? trimmed.split(/\s+/).length : 0;
      }, [newTurnText]);
      const currentSymbolCount = newTurnText.length;

      // Creation Validation Check
      const creationValidation = useMemo(() => {
        if (!currentUser) return { canCreate: false, reason: 'You must be logged in to create a story.' };
        if (!initialPrompt.trim()) return { canCreate: false, reason: 'Initial prompt is required.' };
        if (visibility !== 'open' && !allowedUsersInput.trim()) {
          return { canCreate: false, reason: 'List at least one contributor username/email for Closed/Hidden stories.' };
        }
        if (limitType === 'word' && initialPromptWordCount > Number(limitValue)) {
          return { canCreate: false, reason: `Prompt exceeds limit (${initialPromptWordCount}/${limitValue} words)` };
        }
        if (limitType === 'symbol' && initialPromptSymbolCount > Number(limitValue)) {
          return { canCreate: false, reason: `Prompt exceeds limit (${initialPromptSymbolCount}/${limitValue} symbols)` };
        }
        return { canCreate: true, reason: '' };
      }, [currentUser, initialPrompt, visibility, allowedUsersInput, limitType, limitValue, initialPromptWordCount, initialPromptSymbolCount]);

      // Turn Validation Check
      const turnValidation = useMemo(() => {
        if (!currentUser) return { canPost: false, reason: 'You must be logged in to post a turn.' };
        if (!activeStory) return { canPost: false, reason: 'No story selected.' };

        const userIdentifier = currentUser.user_metadata?.username || currentUser.email;
        const isCreator = activeStory.creator_id === currentUser.id;
        const isAllowedList = activeStory.allowed_users || [];

        // Check Access Rights for Closed / Hidden Stories
        if ((activeStory.visibility === 'closed' || activeStory.visibility === 'hidden') && !isCreator && !isAllowedList.includes(userIdentifier)) {
          return { canPost: false, reason: 'This story is restricted to invited authors.' };
        }

        // Check Maximum Turns
        if (activeStory.turn_limit && activeStory.entries.length >= activeStory.turn_limit) {
          return { canPost: false, reason: 'This story has reached its maximum allowed turn count.' };
        }

        // Check Strict Turn Order
        if (activeStory.turn_order_type === 'fixed' && isAllowedList.length > 0) {
          const fullOrder = [activeStory.creator_id, ...isAllowedList];
          const nextAuthorExpected = fullOrder[activeStory.entries.length % fullOrder.length];
          if (userIdentifier !== nextAuthorExpected && currentUser.id !== nextAuthorExpected) {
            return { canPost: false, reason: `It is currently ${nextAuthorExpected}'s turn.` };
          }
        }

        // Consecutive Entry Rule Evaluation
        const lastEntry = activeStory.entries[activeStory.entries.length - 1];
        if (lastEntry && (lastEntry.author_id === currentUser.id || lastEntry.author_name === userIdentifier)) {
          const mode = activeStory.consecutive_mode || 'not_allowed';
          if (mode === 'not_allowed') {
            return { canPost: false, reason: 'Consecutive turns are not allowed. Wait for another author to post.' };
          } else if (mode === 'author_only' && !isCreator) {
            return { canPost: false, reason: 'Consecutive turns are only permitted for the story creator.' };
          }
        }

        if (activeStory.limit_type === 'word' && currentWordCount > activeStory.limit_value) {
          return { canPost: false, reason: `Word limit exceeded (${currentWordCount}/${activeStory.limit_value} words).` };
        }
        if (activeStory.limit_type === 'symbol' && currentSymbolCount > activeStory.limit_value) {
          return { canPost: false, reason: `Symbol limit exceeded (${currentSymbolCount}/${activeStory.limit_value} characters).` };
        }

        if (currentSymbolCount === 0) {
          return { canPost: false, reason: 'Write your entry before posting.' };
        }

        return { canPost: true, reason: 'Ready to post!' };
      }, [currentUser, activeStory, currentWordCount, currentSymbolCount]);

      // Load this user's subscription state for the active story.
  useEffect(() => {
    let cancelled = false;
    (async () => {
      if (!currentUser || !activeStory) { if (!cancelled) setNotifyOn(false); return; }
      const { data } = await supabase
        .from('story_subscribers')
        .select('user_id')
        .eq('story_id', activeStory.id)
        .eq('user_id', currentUser.id)
        .maybeSingle();
      if (!cancelled) setNotifyOn(!!data);
    })();
    return () => { cancelled = true; };
  }, [currentUser, activeStory?.id]);

  const toggleNotify = async () => {
    if (!currentUser) { setActiveTab('auth'); return; }
    if (!activeStory) return;
    if (notifyOn) {
      const { error } = await supabase
        .from('story_subscribers')
        .delete()
        .eq('story_id', activeStory.id)
        .eq('user_id', currentUser.id);
      if (!error) setNotifyOn(false);
    } else {
      const { error } = await supabase
        .from('story_subscribers')
        .insert([{ story_id: activeStory.id, user_id: currentUser.id, email: currentUser.email }]);
      if (!error) setNotifyOn(true);
      else alert('Could not subscribe: ' + error.message);
    }
  };

  // Auth Handlers
      const handleAuthSubmit = async (e) => {
        e.preventDefault();
        setAuthMessage('');

        if (isSignUp) {
          const { data, error } = await supabase.auth.signUp({
            email: authEmail,
            password: authPassword,
            options: {
              data: { username: authUsername.trim() || authEmail.split('@')[0] }
            }
          });
          if (error) setAuthMessage(error.message);
          else setAuthMessage('Activation link sent! Check your email to verify your account.');
        } else {
          const { data, error } = await supabase.auth.signInWithPassword({
            email: authEmail,
            password: authPassword
          });
          if (error) setAuthMessage(error.message);
          else {
            setCurrentUser(data.user);
            setActiveTab('browse');
          }
        }
      };

      const handleLogout = async () => {
        await supabase.auth.signOut();
        setCurrentUser(null);
      };

      // Story Handlers
      const handleCreateStory = async (e) => {
        e.preventDefault();
        if (!creationValidation.canCreate) return;

        const displayName = currentUser.user_metadata?.username || currentUser.email.split('@')[0];
        const parsedAllowedUsers = allowedUsersInput
          .split(',')
          .map(u => u.trim())
          .filter(u => u.length > 0);

        const { data: storyData, error: storyError } = await supabase
          .from('stories')
          .insert([
            {
              title: newTitle.trim() || 'Untitled Chain Story',
              description: newDesc.trim() || 'No description provided.',
              creator_id: currentUser.id,
              limit_type: limitType,
              limit_value: Number(limitValue),
              turn_limit: turnLimit ? Number(turnLimit) : null,
              visibility: visibility,
              allowed_users: parsedAllowedUsers,
              turn_order_type: turnOrderType,
              consecutive_mode: consecutiveMode,
              is_anonymous: isAnonymous
            }
          ])
          .select()
          .single();

        if (storyError) {
          alert('Error creating story: ' + storyError.message);
          return;
        }

        const { error: entryError } = await supabase
          .from('story_entries')
          .insert([
            {
              story_id: storyData.id,
              author_id: currentUser.id,
              author_name: isAnonymous ? 'Anonymous Author' : displayName,
              content: initialPrompt.trim(),
              word_count: initialPromptWordCount,
              symbol_count: initialPromptSymbolCount
            }
          ]);

        if (entryError) {
          alert('Error saving prompt: ' + entryError.message);
        } else {
          setNewTitle('');
          setNewDesc('');
          setInitialPrompt('');
          setAllowedUsersInput('');
          await fetchStories();
          setActiveStoryId(storyData.id);
          setActiveTab('read');
        }
      };

      const handlePostTurn = async () => {
        if (!turnValidation.canPost) return;

        const displayName = currentUser.user_metadata?.username || currentUser.email.split('@')[0];

        const { error } = await supabase
          .from('story_entries')
          .insert([
            {
              story_id: activeStory.id,
              author_id: currentUser.id,
              author_name: activeStory.is_anonymous ? 'Anonymous Author' : displayName,
              content: newTurnText.trim(),
              word_count: currentWordCount,
              symbol_count: currentSymbolCount
            }
          ]);

        if (error) {
          alert('Error posting turn: ' + error.message);
        } else {
          // Contributors are subscribed by default unless they opted out.
          if (!notifyOn) {
            await supabase
              .from('story_subscribers')
              .upsert(
                [{ story_id: activeStory.id, user_id: currentUser.id, email: currentUser.email }],
                { onConflict: 'story_id,user_id' }
              );
            setNotifyOn(true);
          }
          setNewTurnText('');
          await fetchStories();
        }
      };

      return (
        <div className="max-w-4xl mx-auto px-4 py-6">
          <header className="flex flex-col md:flex-row items-center justify-between gap-4 mb-6 pb-4 border-b border-gray-700">
            <div>
              <h1 className="text-2xl font-bold text-amber-400 flex items-center gap-2">
                <FeatherIcon /> SlovoL Chain Stories
              </h1>
              <p className="text-xs text-gray-400 mt-1">Collaborative Writing Engine</p>
            </div>

            <div className="flex items-center gap-3">
              {currentUser ? (
                <div className="flex items-center gap-2 bg-gray-800 px-3 py-1.5 rounded-lg border border-gray-700">
                  <UserIcon />
                  <span className="text-xs font-semibold text-gray-200">
                    {currentUser.user_metadata?.username || currentUser.email}
                  </span>
                  <span className="slovol-chip slovol-chip-lime text-[10px]">Active</span>
                  <button onClick={handleLogout} className="ml-2 text-xs text-red-400 hover:underline">Log Out</button>
                </div>
              ) : (
                <button onClick={() => setActiveTab('auth')} className="slovol-btn slovol-btn-primary text-xs">
                  Log In / Sign Up
                </button>
              )}
            </div>
          </header>

          <div className="flex gap-2 mb-6 overflow-x-auto pb-2 border-b border-gray-800">
            <button onClick={() => setActiveTab('browse')} className={`slovol-btn ${activeTab === 'browse' ? 'slovol-btn-primary' : ''}`}>
              Browse Stories ({visibleStories.length})
            </button>
            <button onClick={() => setActiveTab('read')} className={`slovol-btn ${activeTab === 'read' ? 'slovol-btn-primary' : ''}`}>
              Workspace
            </button>
            <button onClick={() => setActiveTab('create')} className={`slovol-btn ${activeTab === 'create' ? 'slovol-btn-primary' : ''}`}>
              + New Story
            </button>
          </div>

          {/* BROWSE TAB */}
          {activeTab === 'browse' && (
            <div>
              {loading ? (
                <div className="text-center py-10 text-gray-400 text-sm">Loading stories from database...</div>
              ) : visibleStories.length === 0 ? (
                <div className="slovol-card text-center py-8">
                  <p className="text-gray-300 text-sm mb-3">No stories visible to you yet.</p>
                  <button onClick={() => setActiveTab('create')} className="slovol-btn slovol-btn-primary text-xs">
                    Start a new story!
                  </button>
                </div>
              ) : (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {visibleStories.map(s => (
                    <div key={s.id} className={`slovol-card flex flex-col justify-between ${s.id === activeStoryId ? 'active' : ''}`}>
                      <div>
                        <div className="flex justify-between items-start gap-2 mb-2">
                          <h3 className="font-bold text-amber-400 text-lg">{s.title}</h3>
                          <span className="slovol-chip">{s.entries.length}{s.turn_limit ? `/${s.turn_limit}` : ''} Turns</span>
                        </div>
                        <p className="text-xs text-gray-300 mb-3">{s.description}</p>
                        <div className="flex flex-wrap gap-2 text-xs mb-4">
                          <span className="slovol-chip slovol-chip-amber">Limit: {s.limit_value} {s.limit_type}s</span>
                          <span className={`slovol-chip ${s.visibility === 'hidden' ? 'slovol-chip-red' : s.visibility === 'closed' ? 'slovol-chip-amber' : 'slovol-chip-lime'}`}>
                            {s.visibility === 'hidden' ? '🔒 Hidden' : s.visibility === 'closed' ? '👥 Closed Group' : '🌐 Open Public'}
                          </span>
                          <span className="slovol-chip">
                            {s.turn_order_type === 'fixed' ? '🔄 Round Robin' : '⚡ Free-for-all'}
                          </span>
                        </div>
                      </div>
                      <button onClick={() => { setActiveStoryId(s.id); setActiveTab('read'); }} className="slovol-btn text-xs w-full">
                        View Story →
                      </button>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {/* WORKSPACE TAB */}
          {activeTab === 'read' && (
            <div>
              {!activeStory ? (
                <div className="slovol-card text-center py-8">
                  <p className="text-gray-300 text-sm">Select or create a story to start writing.</p>
                </div>
              ) : (
                <div className="space-y-6">
                  <div className="slovol-card">
                    <div className="flex justify-between items-start">
                      <h2 className="text-xl font-bold text-amber-400 mb-1">{activeStory.title}</h2>
                      <span className="slovol-chip slovol-chip-amber text-[10px]">
                        {activeStory.visibility?.toUpperCase() || 'OPEN'}
                      </span>
                    </div>
                    <p className="text-xs text-gray-300">{activeStory.description}</p>
                    <label className="mt-3 flex items-center gap-2 text-xs text-gray-300 cursor-pointer select-none" title={currentUser ? 'Email me when someone adds a turn to this story' : 'Log in to receive email notifications'}>
                      <input
                        type="checkbox"
                        checked={notifyOn}
                        disabled={!currentUser}
                        onChange={toggleNotify}
                        className="w-4 h-4 accent-amber-500"
                      />
                      Notify me by email when this story is updated
                      {!currentUser && <span className="text-[10px] text-gray-500">(log in first)</span>}
                    </label>
                  </div>

                  <div className="space-y-4">
                    {activeStory.entries.map((entry, idx) => (
                      <div key={entry.id} className="slovol-card">
                        <div className="flex justify-between items-center mb-2 pb-2 border-b border-gray-700">
                          <span className="text-xs font-semibold text-amber-300">#{idx + 1} — {entry.author_name}</span>
                          <span className="text-[11px] text-gray-400">{new Date(entry.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
                        </div>
                        <p className="text-sm text-gray-200 leading-relaxed whitespace-pre-line">{entry.content}</p>
                        <div className="mt-2 text-right text-[10px] text-gray-500">
                          {entry.word_count} words | {entry.symbol_count} characters
                        </div>
                      </div>
                    ))}
                  </div>

                  {/* Editor */}
                  <div className="slovol-card border-amber-500/50">
                    <h3 className="text-sm font-bold text-amber-400 mb-2">Contribute Next Turn</h3>
                    
                    {!turnValidation.canPost ? (
                      <div className="slovol-quote text-xs text-red-300 border-red-500 my-2">{turnValidation.reason}</div>
                    ) : (
                      <div className="slovol-quote text-xs text-lime-300 border-lime-500 my-2">
                        Ready to post! Limit: max {activeStory.limit_value} {activeStory.limit_type}s.
                      </div>
                    )}

                    <textarea
                      value={newTurnText}
                      onChange={(e) => setNewTurnText(e.target.value)}
                      rows={4}
                      placeholder="Type your story entry here..."
                      className="slovol-textarea mt-2 text-sm"
                    ></textarea>

                    <div className="flex flex-col sm:flex-row items-center justify-between gap-4 mt-4 pt-3 border-t border-gray-700">
                      <div className="flex items-center gap-4 text-xs font-mono">
                        <div className={activeStory.limit_type === 'word' && currentWordCount > activeStory.limit_value ? 'text-red-400 font-bold' : 'text-gray-300'}>
                          Words: <span className="text-amber-400 font-bold">{currentWordCount}</span> / {activeStory.limit_type === 'word' ? activeStory.limit_value : '∞'}
                        </div>
                        <div className={activeStory.limit_type === 'symbol' && currentSymbolCount > activeStory.limit_value ? 'text-red-400 font-bold' : 'text-gray-300'}>
                          Symbols: <span className="text-amber-400 font-bold">{currentSymbolCount}</span> / {activeStory.limit_type === 'symbol' ? activeStory.limit_value : '∞'}
                        </div>
                      </div>

                      <button onClick={handlePostTurn} disabled={!turnValidation.canPost} className="slovol-btn slovol-btn-primary w-full sm:w-auto">
                        Post Turn
                      </button>
                    </div>
                  </div>
                </div>
              )}
            </div>
          )}

          {/* CREATE TAB */}
          {activeTab === 'create' && (
            <div className="slovol-card">
              <h2 className="text-lg font-bold text-amber-400 mb-4">Launch a New Chain Story</h2>
              
              {!currentUser ? (
                <div className="slovol-quote text-xs text-amber-300 my-2">
                  You must be logged in to create a story. <button onClick={() => setActiveTab('auth')} className="underline font-bold">Log in here</button>.
                </div>
              ) : (
                <form onSubmit={handleCreateStory} className="space-y-4 text-xs">
                  <div>
                    <label className="block mb-1 text-gray-300 font-medium">Story Title (Optional)</label>
                    <input type="text" value={newTitle} onChange={(e) => setNewTitle(e.target.value)} placeholder="e.g., The Shadow Over Dunwich" className="slovol-input" />
                  </div>

                  <div>
                    <label className="block mb-1 text-gray-300 font-medium">Description (Optional)</label>
                    <input type="text" value={newDesc} onChange={(e) => setNewDesc(e.target.value)} placeholder="Brief premise..." className="slovol-input" />
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                      <label className="block mb-1 text-gray-300 font-medium">Count Metric</label>
                      <select value={limitType} onChange={(e) => setLimitType(e.target.value)} className="slovol-select">
                        <option value="word">Word Count Limit</option>
                        <option value="symbol">Symbol/Character Limit</option>
                      </select>
                    </div>
                    <div>
                      <label className="block mb-1 text-gray-300 font-medium">Limit Value Per Turn</label>
                      <input type="number" min="5" value={limitValue} onChange={(e) => setLimitValue(e.target.value)} required className="slovol-input" />
                    </div>
                  </div>

                  {/* Access & Visibility Setting */}
                  <div className="p-3 bg-gray-900/60 rounded-lg border border-gray-700 space-y-3">
                    <div>
                      <label className="block mb-1 font-bold text-amber-400">Story Access & Visibility</label>
                      <select value={visibility} onChange={(e) => setVisibility(e.target.value)} className="slovol-select">
                        <option value="open">Open — Anyone with an account can read & write</option>
                        <option value="closed">Closed — Anyone can read, but only listed contributors can write</option>
                        <option value="hidden">Hidden — Only creator and listed contributors can see & write</option>
                      </select>
                    </div>

                    {visibility !== 'open' && (
                      <div>
                        <label className="block mb-1 text-gray-300 font-medium">Invited Contributors (Comma separated usernames/emails)</label>
                        <input
                          type="text"
                          value={allowedUsersInput}
                          onChange={(e) => setAllowedUsersInput(e.target.value)}
                          placeholder="e.g. elena@example.com, Marco_Polo"
                          className="slovol-input"
                        />
                      </div>
                    )}
                  </div>

                  {/* Turn Order Setting */}
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                      <label className="block mb-1 text-gray-300 font-medium">Turn Order Rule</label>
                      <select value={turnOrderType} onChange={(e) => setTurnOrderType(e.target.value)} className="slovol-select">
                        <option value="free">Free-for-all (Anyone available can write)</option>
                        <option value="fixed">Strict Round-Robin (Fixed order of contributors)</option>
                      </select>
                    </div>
                    <div>
                      <label className="block mb-1 text-gray-300 font-medium">Consecutive Entries Rule</label>
                      <select value={consecutiveMode} onChange={(e) => setConsecutiveMode(e.target.value)} className="slovol-select">
                        <option value="not_allowed">Not Allowed (Strict alternating turns)</option>
                        <option value="author_only">Allowed for Creator Only</option>
                        <option value="any">Allowed for Any Contributor</option>
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="block mb-1 text-gray-300 font-medium">Initial Story Prompt (Mandatory)</label>
                    <textarea
                      rows={4}
                      value={initialPrompt}
                      onChange={(e) => setInitialPrompt(e.target.value)}
                      required
                      placeholder="Write the opening lines of your chain story..."
                      className="slovol-textarea"
                    ></textarea>
                  </div>

                  <div className="flex flex-col sm:flex-row items-center justify-between gap-4 pt-3 border-t border-gray-700">
                    <div className="flex items-center gap-4 text-xs font-mono">
                      <div className={limitType === 'word' && initialPromptWordCount > Number(limitValue) ? 'text-red-400 font-bold' : 'text-gray-300'}>
                        Words: <span className="text-amber-400 font-bold">{initialPromptWordCount}</span> / {limitType === 'word' ? limitValue : '∞'}
                      </div>
                      <div className={limitType === 'symbol' && initialPromptSymbolCount > Number(limitValue) ? 'text-red-400 font-bold' : 'text-gray-300'}>
                        Symbols: <span className="text-amber-400 font-bold">{initialPromptSymbolCount}</span> / {limitType === 'symbol' ? limitValue : '∞'}
                      </div>
                    </div>

                    <button type="submit" disabled={!creationValidation.canCreate} className="slovol-btn slovol-btn-primary w-full sm:w-auto py-2">
                      Create Story
                    </button>
                  </div>
                  
                  {!creationValidation.canCreate && (
                    <p className="text-right text-xs text-red-400 font-semibold">{creationValidation.reason}</p>
                  )}
                </form>
              )}
            </div>
          )}

          {/* AUTH TAB */}
          {activeTab === 'auth' && (
            <div className="max-w-md mx-auto slovol-card">
              <h2 className="text-lg font-bold text-amber-400 mb-2">
                {isSignUp ? 'Create an Account' : 'Account Login'}
              </h2>
              <p className="text-xs text-gray-400 mb-4">
                {isSignUp ? 'Sign up to create and participate in chain stories.' : 'Log in using your registered credentials.'}
              </p>

              {authMessage && (
                <div className="slovol-quote text-xs text-amber-300 my-3">
                  {authMessage}
                </div>
              )}

              <form onSubmit={handleAuthSubmit} className="space-y-3 text-xs">
                {isSignUp && (
                  <div>
                    <label className="block mb-1 text-gray-300 font-medium">Author Username</label>
                    <input
                      type="text"
                      required
                      placeholder="e.g. StoryTeller99"
                      value={authUsername}
                      onChange={(e) => setAuthUsername(e.target.value)}
                      className="slovol-input"
                    />
                  </div>
                )}
                <div>
                  <label className="block mb-1 text-gray-300 font-medium">Email Address</label>
                  <input
                    type="email"
                    required
                    placeholder="you@example.com"
                    value={authEmail}
                    onChange={(e) => setAuthEmail(e.target.value)}
                    className="slovol-input"
                  />
                </div>
                <div>
                  <label className="block mb-1 text-gray-300 font-medium">Password</label>
                  <input
                    type="password"
                    required
                    placeholder="••••••••"
                    value={authPassword}
                    onChange={(e) => setAuthPassword(e.target.value)}
                    className="slovol-input"
                  />
                </div>

                <button type="submit" className="slovol-btn slovol-btn-primary w-full py-2">
                  {isSignUp ? 'Sign Up' : 'Log In'}
                </button>
              </form>

              <div className="mt-4 pt-3 border-t border-gray-700 text-center text-xs text-gray-400">
                {isSignUp ? 'Already have an account?' : "Don't have an account yet?"}{' '}
                <button
                  onClick={() => { setIsSignUp(!isSignUp); setAuthMessage(''); }}
                  className="text-amber-400 font-bold hover:underline"
                >
                  {isSignUp ? 'Log in here' : 'Sign up here'}
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Modern React 18 Root Mounting
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
