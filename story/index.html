<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chain Story Platform - SlovoL Theme</title>
  
  <!-- React & React DOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>

  <style>
    :root {
      --bg: #111827;          
      --surface: #1f2937;     
      --surface-2: #374151;   
      --border: #4b5563;      
      --text: #f3f4f6;        
      --text-body: #d1d5db;   
      --text-muted: #9ca3af;  
      --text-faint: #4b5563;  
      --accent: #fbbf24;      
      --accent-soft: #fde68a; 
      --success: #a3e635;     
      --danger: #ef4444;      
      --danger-text: #f87171; 
      --radius-card: 12px;
      --radius-modal: 16px;
      --radius-btn: 8px;
      --radius-field: 6px;
      --radius-pill: 999px;
      --shadow-modal: 0 16px 48px rgba(0, 0, 0, .65);
      --overlay: rgba(0, 0, 0, .72);
      --nav-bg: rgba(17, 24, 39, .92);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 90px;
    }

    .slovol-card {
      background: var(--surface);
      border-radius: var(--radius-card);
      padding: 16px;
      border: 2px solid var(--surface-2);
    }

    .slovol-card.active { border-color: var(--accent); }
    .slovol-card.complete { border-color: var(--success); }
